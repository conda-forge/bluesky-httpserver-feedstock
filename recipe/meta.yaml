{% set name = "bluesky-httpserver" %}
{% set version = "0.0.15" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 6a027d8cd064e5eae35edf5da33e1aefa837f380d2727c7d27cf1ae2e8a09ace

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - alembic
    - bluesky-queueserver
    - bluesky-queueserver-api
    - cachetools    
    - fastapi
    - httpx2
    - ldap3
    - orjson
    - pandas
    - pamela
    - pydantic >=2,<3
    - pydantic-settings >=2
    - python-jose
    - pyzmq
    - requests
    - sqlalchemy >=2
    - starlette
    - uvicorn

test:
  imports:
    - bluesky_httpserver
    - bluesky_httpserver.server
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/bluesky/bluesky-httpserver
  summary: HTTP Server for communicating with Bluesky Queue Server
  license: BSD-3-Clause
  license_file: LICENSE
  doc_url: https://blueskyproject.io/bluesky-httpserver
  dev_url: https://github.com/bluesky/bluesky-httpserver

extra:
  recipe-maintainers:
    - dmgav
    - mrakitin
