{% set name = "bluesky-httpserver" %}
{% set version = "0.0.14" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 4ef89e74070a2d78ca53f28a82437f06647fc8b88d3a6fc4b9ab31641122e91a

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - alembic
    - bluesky-queueserver
    - bluesky-queueserver-api
    - fastapi
    - ldap3
    - orjson
    - pamela
    - pydantic-settings
    - python-jose
    - pyzmq
    - requests
    - sqlalchemy
    - starlette
    - uvicorn
    - pandas

test:
  imports:
    - bluesky_httpserver
    - bluesky_httpserver.server
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/bluesky/bluesky-httpserver
  summary: HTTP Server for communicating with Bluesky Queue Server
  license: BSD-3-Clause
  license_file: LICENSE
  doc_url: https://blueskyproject.io/bluesky-httpserver
  dev_url: https://github.com/bluesky/bluesky-httpserver

extra:
  recipe-maintainers:
    - dmgav
    - mrakitin
